 * 1. サウンドエンジン (Web Audio API によるシンセ効果音・外部ファイル不要)
 * ============================================================================

class SoundFX {
  constructor() {
    this.ctx = null;
    this.enabled = true;
  }
  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }
  playTone(freq, type, duration, vol = 0.15, delay = 0) {
    if (!this.enabled) return;
    try {
      this.init();
      if (!this.ctx) return;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime + delay);
      gain.gain.setValueAtTime(vol, this.ctx.currentTime + delay);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + delay + duration);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(this.ctx.currentTime + delay);
      osc.stop(this.ctx.currentTime + delay + duration);
    } catch (e) {}
  }
  click() {
    this.playTone(620, 'sine', 0.08, 0.12);
  }
  cardSelect() {
    this.playTone(523.25, 'triangle', 0.1, 0.14, 0);
    this.playTone(783.99, 'triangle', 0.12, 0.14, 0.05);
  }
  correct() {
    this.playTone(523.25, 'sine', 0.12, 0.18, 0);
    this.playTone(659.25, 'sine', 0.12, 0.18, 0.08);
    this.playTone(783.99, 'sine', 0.12, 0.18, 0.16);
    this.playTone(1046.5, 'triangle', 0.3, 0.2, 0.24);
  }
  wrong() {
    this.playTone(300, 'sawtooth', 0.18, 0.12, 0);
    this.playTone(240, 'sawtooth', 0.25, 0.12, 0.15);
  }
  attack() {
    this.playTone(180, 'square', 0.12, 0.18, 0);
    this.playTone(110, 'sawtooth', 0.22, 0.22, 0.06);
  }
  packOpen() {
    const notes = [523, 587, 659, 698, 784, 880, 987, 1046];
    notes.forEach((n, i) => this.playTone(n, 'triangle', 0.14, 0.15, i * 0.055));
  }
  victory() {
    const melody = [
      { f: 523.25, d: 0.12, t: 0 },
      { f: 659.25, d: 0.12, t: 0.13 },
      { f: 783.99, d: 0.12, t: 0.26 },
      { f: 1046.50, d: 0.25, t: 0.39 },
      { f: 783.99, d: 0.12, t: 0.66 },
      { f: 1046.50, d: 0.45, t: 0.80 }
    ];
    melody.forEach(m => this.playTone(m.f, 'triangle', m.d, 0.18, m.t));
  }
}

class ProblemGenerator {
  static generate(worldId, card) {
    const topic = card ? card.world : worldId;
    switch (Number(topic)) {
      case 1: return this.genDecimals(card);
      case 2: return this.genFractions(card);
      case 3: return this.genArea(card);
      case 4: return this.genSpeedAndUnit(card);
      case 5: return this.genPercentAndCircle(card);
      default: return this.genDecimals(card);
    }
  }

  static makeChoices(correctStr, distractors) {
    const set = new Set([String(correctStr)]);
    for (const d of distractors) {
      if (set.size < 4 && String(d) !== String(correctStr)) {
        set.add(String(d));
      }
    }
    const arr = Array.from(set);
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // 【World 5】割合・百分率・円周
  static genPercentAndCircle(card) {
    const patterns = [
      () => {

        const payRate = (100 - off) / 100;
        const ans = Math.round(price * payRate);
        return {
          badge: "ゲームショップ大特価",
          question: `<span class="text-slate-700 font-black">${price}円</span> のゲームソフトが <span class="text-rose-600 font-black">${off}%OFF</span>！代金はいくらになる？`,
          formula: `${price} × (1 － 0.${off}) ＝ ${price} × ${payRate}`,
          answer: `${ans}円`,
          choices: this.makeChoices(`${ans}円`, [`${price * (off / 100)}円`, `${ans + 200}円`, `${ans - 200}円`, `${price - off}円`]),

        };
      },
      () => {

          badge: "果汁％ドリンク",

          formula: `${ml} × 0.${pct / 10}`,
          answer: `${ans}mL`,
          choices: this.makeChoices(`${ans}mL`, [`${ans * 2}mL`, `${ml - ans}mL`, `${ans + 15}mL`, `${pct}mL`]),

            </svg>`
        };
      },
      () => {
        const d = [10, 20, 30, 100][Math.floor(Math.random() * 4)];
        const ans = +(d * 3.14).toFixed(2);
        return {
          badge: "タイヤ・観覧車の円周",
          question: `直径が <span class="text-blue-600 font-black">${d}cm</span> の丸いお皿があります。まわりの長さ（円周）は何cm？（円周率は3.14）`,
          formula: `${d} × 3.14`,
          answer: `${ans}cm`,
          choices: this.makeChoices(`${ans}cm`, [`${+(d * 3.14 * 2).toFixed(2)}cm`, `${+(d + 3.14).toFixed(2)}cm`, `${+(ans + 10).toFixed(1)}cm`, `${d * 3}cm`]),
          hintText: `円周の長さの公式は「直径 × 3.14」！ 小数点の位置を右にずらして計算しよう！`,
          diagramSvg: `
            <svg viewBox="0 0 360 110" class="w-full max-w-sm mx-auto">

            </svg>`
        };
      }
    ];
    return patterns[Math.floor(Math.random() * patterns.length)]();
  }
}

      deck: [...starterIds],
      totalSolved: 0,
      soundEnabled: true,
      tutorialSeen: false
    };
  }

  loadState() {
    try {
      const raw = localStorage.getItem(this.storageKey);
      if (raw) {
        const parsed = JSON.parse(raw);
        const def = this.getDefaultState();
        const merged = { ...def, ...parsed };
        sfx.enabled = merged.soundEnabled !== false;
        return merged;
      }
    } catch (e) {}
    return this.getDefaultState();
  }

  saveState() {
    try {
      localStorage.setItem(this.storageKey, JSON.stringify(this.state));
    } catch (e) {}
    this.updateHeader();
  }

  getRankTitle() {
    const c = this.state.clearedStages.length;
    if (c >= 20) return "伝説の算数グランドマスター";
    if (c >= 15) return "ひらめき算数チャンピオン";
    if (c >= 10) return "リアル計算エース";
    if (c >= 5) return "一人前算数バトラー";
    return "見習い算数バトラー";
  }

  updateHeader() {
    document.getElementById('header-coins').textContent = this.state.coins.toLocaleString();
    document.getElementById('header-collection').textContent = `${this.state.ownedCards.length}/${CARDS_DB.length}`;
    document.getElementById('header-rank').textContent = this.getRankTitle();
    document.getElementById('btn-sound').textContent = this.state.soundEnabled ? '🔊' : '🔇';
  }

  toggleSound() {
    this.state.soundEnabled = !this.state.soundEnabled;
    sfx.enabled = this.state.soundEnabled;
    if (sfx.enabled) sfx.click();
    this.saveState();
    this.showToast(this.state.soundEnabled ? "🔊 効果音をオンにしました！" : "🔇 効果音をオフにしました");
  }

  showToast(msg, colorClass = "bg-slate-800 text-white border-sky-400") {
    const container = document.getElementById('toast-container');
    const el = document.createElement('div');
    el.className = `${colorClass} border-2 px-4 py-3 rounded-2xl shadow-xl font-extrabold text-sm text-center animate-pop-in`;
    el.innerHTML = msg;
    container.appendChild(el);
    setTimeout(() => {
      el.style.opacity = '0';
      el.style.transition = 'opacity 0.3s';
      setTimeout(() => el.remove(), 300);
    }, 2400);
  }

  openModal(html) {
    const backdrop = document.getElementById('modal-backdrop');
    const content = document.getElementById('modal-content');
    content.innerHTML = html;
    backdrop.classList.remove('hidden');
    backdrop.classList.add('flex');
  }

  closeModal() {
    sfx.click();
    const backdrop = document.getElementById('modal-backdrop');
    backdrop.classList.add('hidden');
    backdrop.classList.remove('flex');
  }

  // ==========================================================================
  // チュートリアル（初回自動表示＆いつでも見返し可能）
  // ==========================================================================
  openTutorial(step = 0) {
    sfx.cardSelect();
    this.tutorialStep = step;
    this.renderTutorialModal();
  }

  prevTutorial() {
    if (this.tutorialStep > 0) {
      sfx.click();
      this.tutorialStep -= 1;
      this.renderTutorialModal();
    }
  }

  nextTutorial() {
    if (this.tutorialStep < TUTORIAL_STEPS.length - 1) {
      sfx.click();
      this.tutorialStep += 1;
      this.renderTutorialModal();
    } else {
      this.finishTutorial();
    }
  }

  finishTutorial() {
    this.state.tutorialSeen = true;
    this.saveState();
    this.closeModal();
  }

  renderTutorialModal() {
    const stepData = TUTORIAL_STEPS[this.tutorialStep];
    const isFirst = this.tutorialStep === 0;
    const isLast = this.tutorialStep === TUTORIAL_STEPS.length - 1;

    const dots = TUTORIAL_STEPS.map((_, idx) => `
      <div class="h-2.5 rounded-full transition-all ${idx === this.tutorialStep ? 'w-7 bg-sky-600' : 'w-2.5 bg-slate-300'}"></div>
    `).join('');

    this.openModal(`
      <div class="space-y-4">
        <div class="flex items-center justify-between">
          <span class="bg-sky-100 text-sky-800 font-black text-xs px-3 py-1 rounded-full border border-sky-300">
            📖 あそびかたガイド（${stepData.badge}）
          </span>
          <button onclick="app.finishTutorial()" class="text-slate-400 hover:text-slate-700 font-black text-xs bg-slate-100 px-2.5 py-1 rounded-lg">
            スキップ ✕
          </button>
        </div>

        <!-- ステップインジケーター -->
        <div class="flex justify-center gap-2 py-1">
          ${dots}
        </div>

        <h3 class="text-xl font-black text-slate-800 text-center leading-snug">
          ${stepData.title}
        </h3>

        ${stepData.visual}

        <p class="text-sm font-bold text-slate-700 leading-relaxed bg-slate-50 p-3.5 rounded-2xl border border-slate-200">
          ${stepData.desc}
        </p>

        <div class="flex items-center justify-between gap-3 pt-1">
          ${!isFirst ? `
            <button onclick="app.prevTutorial()"
              class="btn-pop bg-slate-200 hover:bg-slate-300 text-slate-700 font-black px-4 py-3 rounded-2xl text-sm">
              ⬅ もどる
            </button>
          ` : '<div></div>'}

          <button onclick="app.nextTutorial()"
            class="btn-pop flex-1 ${isLast
              ? 'bg-gradient-to-b from-emerald-400 to-emerald-600 text-white border-emerald-200 shadow-[0_4px_0_#065f46]'
              : 'bg-gradient-to-b from-sky-500 to-blue-600 text-white border-sky-300 shadow-[0_4px_0_#1e3a8a]'
            } font-black py-3 px-5 rounded-2xl border-2 text-sm sm:text-base">
            ${isLast ? '冒険をはじめる！ 🚀' : 'つぎへ ➡'}
          </button>
        </div>
      </div>
    `);
  }

  switchView(viewName) {
    sfx.click();
    this.currentView = viewName;
    if (viewName === 'dojo' && !this.dojoProblem) {
      this.nextDojoProblem();
    }
    this.render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ステージ解放判定
  isStageUnlocked(worldId, stageIdx) {
    if (worldId === 1 && stageIdx === 0) return true;
    const world = WORLDS.find(w => w.id === worldId);
    if (stageIdx > 0) {
      const prevStageId = world.stages[stageIdx - 1].id;
      return this.state.clearedStages.includes(prevStageId);
    } else {
      const prevWorld = WORLDS.find(w => w.id === worldId - 1);
      const prevBossId = prevWorld.stages[prevWorld.stages.length - 1].id;
      return this.state.clearedStages.includes(prevBossId);
    }
  }

  // カード表示コンポーネント生成
  renderCardHTML(card, options = {}) {
    const {
      clickable = false,
      onClickAttr = '',
      selected = false,
      inDeck = false,
      locked = false,
      compact = false
    } = options;

    if (locked) {
      return `
        <div class="relative rounded-2xl bg-slate-200 border-4 border-slate-300 p-3 flex flex-col items-center justify-center text-slate-400 ${compact ? 'h-44' : 'h-60'}">
          <div class="text-4xl mb-1 opacity-50">❓</div>
          <div class="text-xs font-black">未発見カード</div>
          <div class="text-[10px] mt-1">パックでゲット！</div>
        </div>
      `;
    }

    const rarityClass = card.rarity === 'SR' ? 'card-sr' : card.rarity === 'R' ? 'card-rare' : 'card-common';
    const rarityBadge = card.rarity === 'SR'
      ? '<span class="bg-gradient-to-r from-amber-500 to-orange-600 text-white text-[10px] font-black px-2 py-0.5 rounded-full shadow">SR 超レア</span>'
      : card.rarity === 'R'
      ? '<span class="bg-blue-600 text-white text-[10px] font-black px-2 py-0.5 rounded-full">R レア</span>'
      : '<span class="bg-slate-500 text-white text-[10px] font-black px-2 py-0.5 rounded-full">N ノーマル</span>';

    const worldInfo = WORLDS.find(w => w.id == card.world);
    const displayEmoji = card.emojiOverride || card.icon;

    return `
      <div ${clickable ? `onclick="${onClickAttr}"` : ''}
        class="relative rounded-2xl ${rarityClass} p-2.5 sm:p-3 flex flex-col justify-between transition-all duration-150
        ${clickable ? 'cursor-pointer hover:-translate-y-1.5 active:translate-y-0' : ''}
        ${selected ? 'ring-4 ring-rose-500 -translate-y-2' : ''}
        ${compact ? 'h-48 sm:h-52' : 'h-64 sm:h-72'}">
        
        <!-- 上部ヘッダー -->
        <div class="flex items-center justify-between gap-1">
          ${rarityBadge}
          <span class="bg-rose-500 text-white text-xs font-black px-2 py-0.5 rounded-lg shadow-sm">
            ⚔️ ${card.power}
          </span>
        </div>

        <!-- イラストエリア -->
        <div class="my-1.5 bg-white/85 rounded-xl border-2 border-slate-200/80 flex-1 flex flex-col items-center justify-center p-1.5 relative overflow-hidden">
          <div class="${compact ? 'text-4xl' : 'text-5xl sm:text-6xl'} drop-shadow-sm transform transition hover:scale-110">
            ${displayEmoji}
          </div>
          <span class="mt-1 text-[10px] font-extrabold px-2 py-0.5 rounded-full ${worldInfo.bgLight} text-slate-700 border border-slate-200">
            ${worldInfo.icon} W${worldInfo.id}
          </span>
          ${inDeck ? '<span class="absolute top-1 right-1 bg-emerald-500 text-white text-[10px] font-black px-1.5 py-0.5 rounded-md shadow">デッキ中</span>' : ''}
        </div>

        <!-- カード名＆ワザ -->
        <div class="text-center">
          <div class="font-black text-slate-800 ${compact ? 'text-xs' : 'text-xs sm:text-sm'} leading-tight line-clamp-1">
            ${card.name}
          </div>
          <div class="mt-1 bg-slate-800/90 text-amber-300 text-[10px] font-bold py-0.5 px-2 rounded-lg truncate">
            ✨ ${card.skill}
          </div>
        </div>
      </div>
    `;
  }

  /**
   * ==========================================================================
   * 画面描画ルーター
   * ==========================================================================
   */
  render() {
    const main = document.getElementById('main-container');
    switch (this.currentView) {
      case 'home': main.innerHTML = this.viewHome(); break;
      case 'world': main.innerHTML = this.viewWorldSelect(); break;
      case 'battle': main.innerHTML = this.viewBattle(); break;
      case 'zukan': main.innerHTML = this.viewZukanAndDeck(); break;
      case 'gacha': main.innerHTML = this.viewGacha(); break;
      case 'dojo': main.innerHTML = this.viewDojo(); break;
    }
  }

                    <div>

                        ${cleared ? '<span class="bg-emerald-500 text-white text-xs font-black px-2 py-0.5 rounded-md">👑 クリア済</span>' : ''}
                      </div>
                      <h4 class="font-black text-base sm:text-lg text-slate-800 mt-1">${st.title}</h4>
                      <div class="text-xs font-bold text-slate-600 mt-0.5">
                        相手：${unlocked ? st.enemyName : '？？？'} （HP ${st.enemyHp}）
                      </div>
                      <div class="text-xs font-black ${cleared ? 'text-slate-600' : 'text-amber-600'} mt-0.5">
                        ${cleared
                          ? `2回目以降報酬：🪙 ${Math.max(20, Math.round(st.rewardCoins * 0.35))} コイン`

                    ${unlocked ? `
                      <button onclick="app.startBattle(${activeWorld.id}, '${st.id}')"
                        class="btn-pop bg-gradient-to-b from-emerald-400 to-emerald-600 text-white font-black px-4 py-3 rounded-2xl border-2 border-emerald-200 shadow-[0_4px_0_#065f46] text-sm whitespace-nowrap">

                      <div class="text-xs font-black text-slate-400 text-center px-2">

                      </div>
                    `}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      </div>
    `;
  }

  selectWorld(id) {
    sfx.click();
    this.selectedWorldId = id;
    this.render();
  }

  /**
   * 3. カードバトルシステム＆画面
   */
  startBattle(worldId, stageId) {
    sfx.cardSelect();
    const world = WORLDS.find(w => w.id === worldId);
    const stage = world.stages.find(s => s.id === stageId);

    const deckCards = this.state.deck
      .map(id => CARDS_DB.find(c => c.id === id))
      .filter(Boolean);
    const shuffled = [...deckCards].sort(() => Math.random() - 0.5);

    this.battle = {
      world,
      stage,
      playerHp: 300,
      playerMaxHp: 300,
      enemyHp: stage.enemyHp,
      enemyMaxHp: stage.enemyHp,
      drawPile: shuffled.slice(4),
      hand: shuffled.slice(0, 4),
      activeCardIndex: null,
      currentProblem: null,
      showHint: false,
      retryMode: false,
      combo: 0,
      logMessage: `${stage.enemyName} があらわれた！手札からカードを1枚えらぼう！`,
      enemyShake: false,
      playerShake: false
    };

    this.currentView = 'battle';
    this.render();
  }

  selectBattleCard(handIdx) {
    if (!this.battle || this.battle.activeCardIndex !== null) return;
    sfx.cardSelect();
    const card = this.battle.hand[handIdx];
    const problem = ProblemGenerator.generate(this.battle.world.id, card);

    this.battle.activeCardIndex = handIdx;
    this.battle.currentProblem = problem;
    this.battle.showHint = false;
    this.battle.retryMode = false;
    this.render();
  }

  cancelBattleCard() {
    if (!this.battle) return;
    sfx.click();
    this.battle.activeCardIndex = null;
    this.battle.currentProblem = null;
    this.render();
  }

  toggleBattleHint() {
    if (!this.battle) return;
    sfx.click();
    this.battle.showHint = !this.battle.showHint;
    this.render();
  }

  submitBattleAnswer(selectedChoice) {
    if (!this.battle || !this.battle.currentProblem) return;
    const prob = this.battle.currentProblem;
    const card = this.battle.hand[this.battle.activeCardIndex];

    if (selectedChoice === prob.answer) {
      sfx.correct();
      setTimeout(() => sfx.attack(), 220);

      this.state.totalSolved += 1;
      if (!this.battle.retryMode) {
        this.battle.combo += 1;
      }

      const comboMultiplier = 1 + Math.min(this.battle.combo - 1, 4) * 0.15;
      const damage = Math.round(card.power * comboMultiplier);
      this.battle.enemyHp = Math.max(0, this.battle.enemyHp - damage);
      this.battle.enemyShake = true;

      const comboText = this.battle.combo >= 2 ? `（🔥${this.battle.combo}連続ひらめきコンボ！）` : '';
      const recoverText = this.battle.retryMode ? 'ナイスリカバリー！ ' : '';
      this.battle.logMessage = `${recoverText}「${card.name}」の${card.skill}！ ${damage} ダメージ！${comboText}`;

      const usedCard = this.battle.hand.splice(this.battle.activeCardIndex, 1)[0];
      this.battle.drawPile.push(usedCard);
      const nextCard = this.battle.drawPile.shift();
      if (nextCard) this.battle.hand.push(nextCard);

      this.battle.activeCardIndex = null;
      this.battle.currentProblem = null;
      this.battle.showHint = false;
      this.battle.retryMode = false;

      this.saveState();
      this.render();

      setTimeout(() => {
        if (this.battle) {
          this.battle.enemyShake = false;
          if (this.battle.enemyHp <= 0) {
            this.handleBattleVictory();
          } else {
            this.render();
          }
        }
      }, 500);

    } else {
      sfx.wrong();
      this.battle.combo = 0;
      this.battle.retryMode = true;
      this.battle.showHint = true;
      const enemyDmg = 25;
      this.battle.playerHp = Math.max(10, this.battle.playerHp - enemyDmg);
      this.battle.playerShake = true;
      this.battle.logMessage = `おしい！ハカセ犬の図解ヒントを見て、もう1回チャレンジしよう！`;

      this.showToast("🐶 おしい！下の【ひらめき図解】を見て再挑戦しよう！", "bg-amber-500 text-slate-900 border-white");
      this.render();

      setTimeout(() => {
        if (this.battle) {
          this.battle.playerShake = false;
          this.render();
        }
      }, 500);
    }
  }

  handleBattleVictory() {
    sfx.victory();
    const { stage, world } = this.battle;
    const isFirstClear = !this.state.clearedStages.includes(stage.id);
    if (isFirstClear) {
      this.state.clearedStages.push(stage.id);
    }
    const repeatCoins = Math.max(20, Math.round(stage.rewardCoins * 0.35));
    const earnedCoins = isFirstClear ? stage.rewardCoins : repeatCoins;
    this.state.coins += earnedCoins;
    this.saveState();

    this.openModal(`
      <div class="text-center space-y-4">
        <div class="text-6xl animate-bounce">🏆</div>
        <div class="inline-block ${isFirstClear ? 'bg-amber-400 text-slate-900' : 'bg-sky-500 text-white'} font-black px-3 py-1 rounded-full text-xs">
          STAGE ${stage.id} ${isFirstClear ? '初回クリア！' : 'クリア！（2回目以降）'}
        </div>
        <h3 class="text-2xl sm:text-3xl font-black text-slate-800">
          やったね！大勝利！
        </h3>
        <p class="text-sm font-bold text-slate-600">
          ${stage.enemyName} との計算バトルに勝ったよ！
        </p>

        <div class="bg-amber-50 border-2 border-amber-300 rounded-2xl p-4 flex items-center justify-center gap-3">
          <span class="text-4xl">🪙</span>
          <div class="text-left">
            <div class="text-xs font-bold text-amber-800">
              ${isFirstClear ? '✨ 初回クリアボーナス！' : '🔄 クリア報酬（2回目以降）'}
            </div>
            <div class="text-2xl font-black text-amber-600">+${earnedCoins} コイン獲得！</div>
            ${!isFirstClear ? `<div class="text-[11px] font-bold text-slate-500 mt-0.5">※未クリアのステージだと初回ボーナスがたくさんもらえるよ！</div>` : ''}
          </div>
        </div>

        <div class="flex flex-col sm:flex-row gap-2.5 pt-2">
          <button onclick="app.closeModal(); app.switchView('gacha');"
            class="btn-pop flex-1 bg-amber-400 hover:bg-amber-500 text-slate-900 font-black py-3 px-4 rounded-2xl border-2 border-amber-200 shadow-[0_4px_0_#b45309]">
            🎁 パックを開けに行く
          </button>
          <button onclick="app.closeModal(); app.switchView('world');"
            class="btn-pop flex-1 bg-sky-500 hover:bg-sky-600 text-white font-black py-3 px-4 rounded-2xl border-2 border-sky-200 shadow-[0_4px_0_#0369a1]">
            🗺️ ステージ選択へ
          </button>
        </div>
      </div>
    `);
  }

  viewBattle() {
    const b = this.battle;
    if (!b) return this.viewWorldSelect();

    const enemyHpPct = Math.round((b.enemyHp / b.enemyMaxHp) * 100);
    const playerHpPct = Math.round((b.playerHp / b.playerMaxHp) * 100);

      <div class="space-y-4">

        <div class="flex items-center justify-between gap-2">

            ⬅ にげる
          </button>
          <div class="bg-slate-800 text-white px-3 py-1 rounded-full text-xs sm:text-sm font-black">

          </div>
        </div>

        <div class="bg-gradient-to-b ${b.world.color} rounded-3xl border-4 border-white shadow-xl p-4 sm:p-5 text-white">

                <span class="text-xl">🐶</span>
                <span>${b.logMessage}</span>
              </div>
            </div>
          </div>
        </div>

        <!-- カード発動中の算数ミッションパネル OR 手札4枚選択 -->
        ${b.activeCardIndex !== null && b.currentProblem ? `
          <div class="bg-white rounded-3xl border-4 border-amber-400 shadow-2xl p-4 sm:p-6 animate-pop-in">
            <div class="flex flex-wrap items-center justify-between gap-2 pb-3 border-b-2 border-slate-100">
              <div class="flex items-center gap-2">
                <span class="text-2xl">${b.hand[b.activeCardIndex].emojiOverride || b.hand[b.activeCardIndex].icon}</span>
                <div>
                  <span class="bg-amber-100 text-amber-800 text-[10px] font-black px-2 py-0.5 rounded-full">
                    ${b.currentProblem.badge}
                  </span>
                  <h3 class="font-black text-sm sm:text-base text-slate-800">
                    「${b.hand[b.activeCardIndex].name}」の計算ミッション！
                  </h3>
                </div>
              </div>
              <div class="flex items-center gap-2">
                <button onclick="app.toggleBattleHint()"
                  class="btn-pop bg-amber-400 hover:bg-amber-500 text-slate-900 font-black px-3 py-1.5 rounded-xl border-2 border-amber-200 shadow-[0_3px_0_#b45309] text-xs sm:text-sm">
                  💡 ${b.showHint ? '図解をとじる' : 'ひらめき図解を見る'}
                </button>
                <button onclick="app.cancelBattleCard()"
                  class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-3 py-1.5 rounded-xl text-xs">

              <div class="mb-4 bg-amber-50 border-2 border-amber-300 rounded-2xl p-3.5 animate-pop-in">

                  <span class="text-xl">🐶</span>
                  <span>ハカセ犬のひらめき図解：${b.currentProblem.hintText}</span>
                </div>
                <div class="bg-white rounded-xl p-2 border border-amber-200">
                  ${b.currentProblem.diagramSvg}
                </div>
              </div>
            ` : ''}

            <!-- 4択回答ボタン -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              ${b.currentProblem.choices.map((choice, i) => `
                <button onclick="app.submitBattleAnswer('${choice}')"

                  <span class="bg-white/25 w-7 h-7 rounded-full flex items-center justify-center text-xs">${['A','B','C','D'][i]}</span>

        ` : `
          <!-- 手札4枚エリア -->
          <div class="bg-white/90 backdrop-blur rounded-3xl border-4 border-sky-300 p-4 sm:p-5 shadow-lg">

        `}

      <div class="space-y-5 animate-pop-in">
        <div class="flex flex-wrap items-center justify-between gap-2">

            デッキ枚数：${this.state.deck.length} / 12 枚

        <!-- 現在の12枚デッキ表示 -->

          <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
            <div>
              <h3 class="font-black text-base sm:text-lg text-slate-800">⚔️ 現在のバトルデッキ（12枚）</h3>
              <p class="text-xs font-bold text-slate-500">下の図鑑からカードをタップすると、豆知識を見たりデッキに入れ替えたりできるよ！</p>
            </div>
            <button onclick="app.autoBuildStrongestDeck()"
              class="btn-pop bg-amber-400 hover:bg-amber-500 text-slate-900 font-black px-3.5 py-2 rounded-xl border-2 border-amber-200 shadow-[0_3px_0_#b45309] text-xs sm:text-sm">

            </button>
          </div>

        <!-- ワールドフィルタータブ -->
        <div class="flex flex-wrap gap-2">

          </button>
          ${WORLDS.map(w => `
            <button onclick="app.setZukanFilter('${w.id}')"

        <!-- カード一覧グリッド -->

    sfx.click();
    this.zukanFilter = filter;
    this.render();
  }

  }

  swapDeckCard(deckIndex, newCardId) {
    sfx.cardSelect();
    this.state.deck[deckIndex] = newCardId;
    this.saveState();
    this.closeModal();
    this.showToast("🃏 デッキのカードを入れ替えました！", "bg-emerald-600 text-white border-emerald-200");
    this.render();
  }

  autoBuildStrongestDeck() {
    sfx.cardSelect();
    const ownedObjs = this.state.ownedCards
      .map(id => CARDS_DB.find(c => c.id === id))
      .filter(Boolean)
      .sort((a, b) => b.power - a.power);

    this.state.deck = ownedObjs.slice(0, 12).map(c => c.id);
    this.saveState();
    this.showToast("✨ 攻撃力が高い順に12枚を自動編成しました！", "bg-amber-500 text-slate-900 border-white");
    this.render();
  }

  /**
   * 5. カードパック開封（ガチャ）画面
   */
  viewGacha() {
    return `
      <div class="space-y-5 animate-pop-in">
        <div class="flex items-center justify-between">
          <button onclick="app.switchView('home')" class="btn-pop bg-white text-slate-700 font-black px-4 py-2 rounded-2xl border-2 border-slate-300 shadow-[0_3px_0_#cbd5e1] text-sm">
            ⬅ ホームへもどる
          </button>
          <h2 class="text-lg sm:text-2xl font-black text-slate-800">🎁 リアルワールド・カードショップ</h2>
          <div class="w-20 hidden sm:block"></div>
        </div>

        <div class="bg-gradient-to-br from-amber-100 via-yellow-50 to-orange-100 rounded-3xl border-4 border-amber-400 shadow-xl p-6 sm:p-8 text-center max-w-2xl mx-auto">
          <div class="inline-block bg-rose-600 text-white text-xs font-black px-3 py-1 rounded-full mb-3">
            全42種収録！SR超レア出現率アップ中！
          </div>

          <!-- パックビジュアル -->
          <div class="w-44 h-60 mx-auto my-3 rounded-3xl bg-gradient-to-br from-sky-500 via-indigo-600 to-purple-700 border-4 border-amber-300 shadow-2xl flex flex-col items-center justify-center text-white p-4 animate-float">
            <div class="text-5xl mb-2">🃏</div>
            <div class="font-black text-base leading-tight">リアルワールド<br/>算数パック</div>
            <div class="mt-2 bg-amber-400 text-slate-900 text-xs font-black px-2.5 py-0.5 rounded-full">
              3枚入り！
            </div>
          </div>

          <p class="text-sm font-bold text-slate-700 mt-4">
            持っているコイン： <span class="text-xl font-black text-amber-600">🪙 ${this.state.coins}</span>
          </p>

          <div class="mt-5 flex flex-col sm:flex-row justify-center gap-3">
            <button onclick="app.openCardPack(1)"
              class="btn-pop bg-gradient-to-b from-amber-400 to-orange-500 text-white font-black text-base sm:text-lg px-6 py-4 rounded-2xl border-2 border-yellow-200 shadow-[0_5px_0_#c2410c]">
              🎁 1パック開封（🪙 100）
            </button>
            <button onclick="app.openCardPack(3)"
              class="btn-pop bg-gradient-to-b from-rose-500 to-pink-600 text-white font-black text-base sm:text-lg px-6 py-4 rounded-2xl border-2 border-rose-200 shadow-[0_5px_0_#9f1239]">
              🎉 3パック連続開封（🪙 280）
            </button>
          </div>
          <p class="text-xs font-bold text-slate-500 mt-3">
            ※すでに持っているカードが出た場合は、自動でコインが少し戻ってくるよ！
          </p>
        </div>
      </div>
    `;
  }

  openCardPack(packCount) {
    const cost = packCount === 3 ? 280 : 100;
    if (this.state.coins < cost) {
      sfx.wrong();
      this.showToast("🪙 コインが足りないよ！冒険や道場でコインを集めよう！", "bg-rose-600 text-white border-rose-200");
      return;
    }

    sfx.packOpen();
    this.state.coins -= cost;

    const totalCards = packCount * 3;
    const pulled = [];
    let refundCoins = 0;

    for (let i = 0; i < totalCards; i++) {
      const roll = Math.random();
      let targetRarity = 'C';
      if (roll < 0.22) targetRarity = 'SR';
      else if (roll < 0.60) targetRarity = 'R';

      const pool = CARDS_DB.filter(c => c.rarity === targetRarity);
      const unownedPool = pool.filter(c => !this.state.ownedCards.includes(c.id));
      const finalPool = (unownedPool.length > 0 && Math.random() < 0.75) ? unownedPool : pool;
      const chosen = finalPool[Math.floor(Math.random() * finalPool.length)];

      const isNew = !this.state.ownedCards.includes(chosen.id);
      if (isNew) {
        this.state.ownedCards.push(chosen.id);
      } else {
        refundCoins += chosen.rarity === 'SR' ? 30 : chosen.rarity === 'R' ? 15 : 10;
      }
      pulled.push({ card: chosen, isNew });
    }

    this.state.coins += refundCoins;
    this.saveState();
    this.render();

    this.openModal(`
      <div class="text-center space-y-4">
        <div class="inline-block bg-gradient-to-r from-amber-400 to-orange-500 text-white font-black px-4 py-1 rounded-full text-sm">
          ✨ パック開封結果（${totalCards}枚）✨
        </div>
        <div class="grid grid-cols-3 gap-2.5 max-h-[55vh] overflow-y-auto p-1">
          ${pulled.map(item => `
            <div class="relative animate-card-flip">
              ${item.isNew ? '<span class="absolute -top-2 -left-1 z-10 bg-rose-600 text-white text-[10px] font-black px-2 py-0.5 rounded-full shadow">NEW!</span>' : ''}
              ${this.renderCardHTML(item.card, { compact: true })}
            </div>
          `).join('')}
        </div>
        ${refundCoins > 0 ? `<div class="text-xs font-black text-amber-700 bg-amber-50 py-1.5 px-3 rounded-xl">ダブりボーナスで 🪙 +${refundCoins} コイン還元！</div>` : ''}
        <button onclick="app.closeModal()"
          class="btn-pop w-full bg-sky-500 hover:bg-sky-600 text-white font-black py-3 rounded-2xl border-2 border-sky-200 shadow-[0_4px_0_#0369a1]">
          やったね！とじる
        </button>
      </div>
    `);
  }

  /**
   * 6. ひらめき算数道場（ノーストレス特訓＆コイン稼ぎ）
   */
  setDojoTopic(topicId) {
    sfx.click();
    this.dojoTopic = topicId;
    this.nextDojoProblem();
    this.render();
  }

  nextDojoProblem() {
    this.dojoProblem = ProblemGenerator.generate(this.dojoTopic, null);
    this.dojoShowHint = false;
  }

  toggleDojoHint() {
    sfx.click();
    this.dojoShowHint = !this.dojoShowHint;
    this.render();
  }

  answerDojo(choice) {
    if (!this.dojoProblem) return;
    if (choice === this.dojoProblem.answer) {
      sfx.correct();
      this.dojoStreak += 1;
      const bonus = 15 + Math.min(this.dojoStreak, 5) * 3;
      this.state.coins += bonus;
      this.state.totalSolved += 1;
      this.saveState();
      this.showToast(`🎉 大正解！ 🪙 +${bonus} コインゲット！（${this.dojoStreak}連続）`, "bg-emerald-600 text-white border-emerald-200");
      this.nextDojoProblem();
      this.render();
    } else {
      sfx.wrong();
      this.dojoStreak = 0;
      this.dojoShowHint = true;
      this.showToast("🐶 おしい！図解ヒントを見てからもう1回えらんでみよう！", "bg-amber-500 text-slate-900 border-white");
      this.render();
    }
  }

  viewDojo() {
    if (!this.dojoProblem) this.nextDojoProblem();
    const p = this.dojoProblem;

    return `
      <div class="space-y-5 animate-pop-in">
        <div class="flex items-center justify-between">
          <button onclick="app.switchView('home')" class="btn-pop bg-white text-slate-700 font-black px-4 py-2 rounded-2xl border-2 border-slate-300 shadow-[0_3px_0_#cbd5e1] text-sm">
            ⬅ ホームへもどる
          </button>
          <h2 class="text-lg sm:text-2xl font-black text-slate-800">🥋 ひらめき算数道場</h2>
          <div class="bg-amber-400 text-slate-900 font-black px-3 py-1 rounded-full text-xs sm:text-sm">
            🔥 ${this.dojoStreak} 連続正解
          </div>
        </div>

        <!-- 単元セレクト -->
        <div class="flex flex-wrap gap-2">
          ${WORLDS.map(w => `
            <button onclick="app.setDojoTopic(${w.id})"
              class="px-3 py-2 rounded-2xl font-black text-xs sm:text-sm border-2 transition ${this.dojoTopic === w.id ? 'bg-indigo-600 text-white border-indigo-600 shadow' : 'bg-white text-slate-700 border-slate-300'}">
              ${w.icon} ${w.mathTopic.split('（')[0]}
            </button>
          `).join('')}
        </div>

        <!-- 道場問題カード -->
        <div class="bg-white rounded-3xl border-4 border-indigo-400 shadow-xl p-5 sm:p-6 max-w-3xl mx-auto">
          <div class="flex items-center justify-between gap-2 pb-3 border-b-2 border-slate-100">
            <span class="bg-indigo-100 text-indigo-800 text-xs font-black px-3 py-1 rounded-full">
              ${p.badge}
            </span>
            <button onclick="app.toggleDojoHint()"
              class="btn-pop bg-amber-400 hover:bg-amber-500 text-slate-900 font-black px-3.5 py-1.5 rounded-xl border-2 border-amber-200 shadow-[0_3px_0_#b45309] text-xs sm:text-sm">
              💡 ${this.dojoShowHint ? '図解をとじる' : '図解ヒントを見る'}
            </button>
          </div>

          <div class="my-4 bg-sky-50 border-2 border-sky-200 rounded-2xl p-4 text-base sm:text-xl font-extrabold text-slate-800 leading-relaxed">
            ${p.question}
          </div>

          ${this.dojoShowHint ? `
            <div class="mb-4 bg-amber-50 border-2 border-amber-300 rounded-2xl p-3.5 animate-pop-in">
              <div class="flex items-center gap-2 text-xs sm:text-sm font-black text-amber-900 mb-2">
                <span class="text-xl">🐶</span>
                <span>${p.hintText}</span>
              </div>
              <div class="bg-white rounded-xl p-2 border border-amber-200">
                ${p.diagramSvg}
              </div>
            </div>
          ` : ''}

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            ${p.choices.map((c, i) => `
              <button onclick="app.answerDojo('${c}')"
                class="btn-pop bg-gradient-to-b from-indigo-500 to-blue-600 hover:from-indigo-400 hover:to-blue-500 text-white font-black text-base sm:text-lg py-3.5 px-4 rounded-2xl border-2 border-indigo-300 shadow-[0_4px_0_#1e3a8a] flex items-center justify-center gap-2">
                <span class="bg-white/25 w-7 h-7 rounded-full flex items-center justify-center text-xs">${['A','B','C','D'][i]}</span>
                <span>${c}</span>
              </button>
            `).join('')}
          </div>
        </div>
      </div>
    `;
  }

  /**
   * 7. 設定・先生/保護者向けデモ解放メニュー
   */
  openSettings() {
    sfx.click();
    this.openModal(`
      <div class="space-y-4">
        <div class="flex items-center justify-between border-b-2 border-slate-100 pb-2">
          <h3 class="text-lg font-black text-slate-800">⚙️ せってい・先生/おうちの人メニュー</h3>
          <button onclick="app.closeModal()" class="text-slate-400 hover:text-slate-700 font-black text-xl">✕</button>
        </div>

        <div class="bg-slate-50 rounded-2xl p-4 border border-slate-200 space-y-1 text-xs sm:text-sm font-bold text-slate-700">
          <div>💾 セーブ状態：<span class="font-black text-emerald-600">ブラウザに自動保存中</span></div>
          <div>📊 これまでに解いた問題数：<span class="font-black text-sky-600">${this.state.totalSolved} 問</span></div>
          <div>🏆 クリアしたステージ数：<span class="font-black text-emerald-600">${this.state.clearedStages.length} / 20</span></div>
          <div>🃏 集めたカード種類：<span class="font-black text-amber-600">${this.state.ownedCards.length} / ${CARDS_DB.length} 種</span></div>
        </div>

        <div class="space-y-2.5">
          <button onclick="app.openTutorial(0)"
            class="btn-pop w-full bg-sky-500 hover:bg-sky-600 text-white font-black py-3 px-4 rounded-2xl border-2 border-sky-200 shadow-[0_4px_0_#0369a1] text-sm">
            📖 あそびかたチュートリアルをもう一度見る
          </button>

          <button onclick="app.unlockAllDemo()"
            class="btn-pop w-full bg-gradient-to-r from-amber-400 to-orange-500 text-white font-black py-3 px-4 rounded-2xl border-2 border-amber-200 shadow-[0_4px_0_#c2410c] text-sm">
            🔓 デモ用：全20ステージ ＆ 全42種カード ＆ 9999コイン解放
          </button>

          <button onclick="app.resetProgress()"
            class="w-full bg-slate-200 hover:bg-rose-100 text-slate-700 hover:text-rose-700 font-bold py-2.5 px-4 rounded-2xl text-xs transition">
            🔄 セーブデータを最初からやり直す
          </button>
        </div>
      </div>
    `);
  }

  unlockAllDemo() {
    sfx.victory();
    this.state.coins = 9999;
    this.state.clearedStages = WORLDS.flatMap(w => w.stages.map(s => s.id));
    this.state.ownedCards = CARDS_DB.map(c => c.id);
    this.saveState();
    this.closeModal();
    this.showToast("🎉 全ステージ・全カード・コインを解放しました！", "bg-amber-500 text-slate-900 border-white");
    this.render();
  }

  resetProgress() {
    sfx.wrong();
    this.state = this.getDefaultState();
    this.saveState();
    this.closeModal();
    this.showToast("🔄 データを初期状態にリセットしました");
    this.switchView('home');
    setTimeout(() => this.openTutorial(0), 300);
  }
}

// アプリ起動
window.addEventListener('DOMContentLoaded', () => {
  window.app = new MathBattlerApp();
});
</script>
</body>
</html>
